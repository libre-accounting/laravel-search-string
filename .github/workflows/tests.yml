name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            laravel: "^9.0"
            testbench: "^7.0"
          - php: "8.2"
            laravel: "^10.0"
            testbench: "^8.0"
          - php: "8.2"
            laravel: "^11.0"
            testbench: "^9.0"
          - php: "8.3"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "^13.0"
            testbench: "^11.0"
    name: Laravel ${{ matrix.laravel }} PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Validate composer files
        run: composer validate
      - name: Install dependencies
        # Advisory blocking is turned off so the suite can run against Laravel
        # releases that have an open advisory; this only affects the CI checkout.
        run: |
          composer config audit.block-insecure false
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-progress --no-interaction
      - name: Run tests
        run: vendor/bin/phpunit
